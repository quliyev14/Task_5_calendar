<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   <section class="container">
    <section class="inputs">
        <label>Month:</label>
        <input type="number" id="month" max="12" min="1">
        <label>Year:</label>
        <input type="number" id="year" min="1">
        <hr>
        <button id="generate">Generate</button>
    </section>
    <section class="result">
        <h1 id="title"></h1>
        <table id="calendar">
            <tr>
                <th>MON</th>
                <th>TUE</th>
                <th>WED</th>
                <th>THU</th>
                <th>FRI</th>
                <th>SAT</th>
                <th>SUN</th>
            </tr>
        </table>
    </section>
    <section class="notes">
        <input type="number" id="day" min="1" max="31" placeholder="day...">
        <!-- <input type="text" id="note" placeholder="notes..."> -->
        <button id="save">Save</button>
    </section>
</section>
    <script src="index.js"></script>
</body>
</html>
